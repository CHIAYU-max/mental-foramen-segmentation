<line x1="789.2" y1="80.0" x2="789.2" y2="296.0" class="grid" stroke-width="1" />
<text x="789.2" y="315.0" class="s small" text-anchor="middle">+2</text>
<line x1="707.7" y1="80.0" x2="707.7" y2="296.0" class="axis" stroke-width="1" />
