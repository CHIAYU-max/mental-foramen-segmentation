<line x1="381.5" y1="80.0" x2="381.5" y2="296.0" class="grid" stroke-width="1" />
<text x="381.5" y="315.0" class="s small" text-anchor="middle">-8</text>
<line x1="463.1" y1="80.0" x2="463.1" y2="296.0" class="grid" stroke-width="1" />
<text x="463.1" y="315.0" class="s small" text-anchor="middle">-6</text>
<line x1="544.6" y1="80.0" x2="544.6" y2="296.0" class="grid" stroke-width="1" />
