<circle cx="709.3" cy="278.0" r="5" class="a fill ring" stroke-width="2"/>
<text x="565.0" y="336.0" class="s small" text-anchor="middle">Hit rate difference (points); 2:4 keeps the stem and the 32→3 output layer dense</text></svg>
