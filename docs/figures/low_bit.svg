<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 378" role="img" aria-label="Hit rate change for low-bit and sparse U-Nets"><style>
.bg{fill:#fcfcfb}.t{fill:#0b0b0b}.s{fill:#52514e}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.edge{stroke:#8a8983}
.a{--c:#2a78d6}.b{--c:#eb6834}.c{--c:#6e6d68}
.fill{fill:var(--c)}.line{stroke:var(--c)}.ring{stroke:#fcfcfb}.tint{fill:var(--c);fill-opacity:.12}.card{fill:#fcfcfb}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.title{font-size:16px;font-weight:600}.small{font-size:12px}.bold{font-weight:600}
@media (prefers-color-scheme:dark){
.bg,.card{fill:#1a1a19}.t{fill:#f0efec}.s{fill:#c3c2b7}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.edge{stroke:#8a8983}
.a{--c:#3987e5}.b{--c:#d95926}.c{--c:#a9a89f}.ring{stroke:#1a1a19}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8983"/></marker></defs><rect class="bg" width="860" height="378" rx="8"/>
<text x="24.0" y="30.0" class="t title" text-anchor="start">INT8 with 2:4 sparsity keeps the hit rate; 4-bit activations do not</text>
<text x="24.0" y="50.0" class="s small" text-anchor="start">Cross-validation hit rate difference, 95% CI. Dashed: the pre-set margin of about −1 point</text>
<line x1="300.0" y1="80.0" x2="300.0" y2="296.0" class="grid" stroke-width="1" />
