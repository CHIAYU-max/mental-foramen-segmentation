<circle cx="600.2" cy="186.0" r="5" class="a fill ring" stroke-width="2"/>
<text x="610.2" y="190.0" class="s small" text-anchor="start">47.4% → 86.7%</text>
<text x="238.0" y="226.0" class="t small" text-anchor="end">Contrast × 0.5</text>
<line x1="595.8" y1="222.0" x2="605.5" y2="222.0" class="edge" stroke-width="1" />
<circle cx="605.5" cy="222.0" r="5" class="b fill ring" stroke-width="2"/>
<circle cx="595.8" cy="222.0" r="5" class="a fill ring" stroke-width="2"/>
<text x="615.5" y="226.0" class="s small" text-anchor="start">87.4% → 86.1%</text>
<text x="238.0" y="262.0" class="t small" text-anchor="end">Gaussian blur, σ = 2</text>
<line x1="586.0" y1="258.0" x2="589.8" y2="258.0" class="edge" stroke-width="1" />
