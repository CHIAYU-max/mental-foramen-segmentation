<circle cx="631.0" cy="294.0" r="5" class="a fill ring" stroke-width="2"/>
<text x="641.0" y="298.0" class="s small" text-anchor="start">89.3% → 90.8%</text>
<text x="475.0" y="352.0" class="s small" text-anchor="middle">Foramen hit rate. Gamma 0.6–1.25, brightness ±30, contrast × 0.75–1.5 and half resolution change it by &lt; 1.7 points</text></svg>
