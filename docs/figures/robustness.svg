<circle cx="637.8" cy="114.0" r="5" class="a fill ring" stroke-width="2"/>
<text x="648.5" y="118.0" class="s small" text-anchor="start">91.8% → 91.7%</text>
<text x="238.0" y="154.0" class="t small" text-anchor="end">Gaussian noise, σ = 5</text>
<line x1="571.8" y1="150.0" x2="631.8" y2="150.0" class="edge" stroke-width="1" />
<circle cx="571.8" cy="150.0" r="5" class="b fill ring" stroke-width="2"/>
<circle cx="631.8" cy="150.0" r="5" class="a fill ring" stroke-width="2"/>
<text x="641.8" y="154.0" class="s small" text-anchor="start">82.9% → 90.9%</text>
<text x="238.0" y="190.0" class="t small" text-anchor="end">Gaussian noise, σ = 10</text>
<line x1="305.5" y1="186.0" x2="600.2" y2="186.0" class="edge" stroke-width="1" />
