<rect x="300.0" y="197.0" width="170.5" height="18" rx="3" class="c fill"/>
<text x="478.5" y="210.0" class="s small" text-anchor="start">1023 ms</text>
<text x="288.0" y="242.0" class="t small" text-anchor="end">+ fast argmax (deployed)</text>
<rect x="300.0" y="229.0" width="154.8" height="18" rx="3" class="a fill"/>
<text x="462.8" y="242.0" class="s small" text-anchor="start">929 ms</text>
<text x="288.0" y="274.0" class="t small" text-anchor="end">Deployed, U-Net FP32 instead of INT8</text>
<rect x="300.0" y="261.0" width="375.8" height="18" rx="3" class="b fill"/>
<text x="683.8" y="274.0" class="s small" text-anchor="start">2255 ms (INT8: 2.43× faster)</text>
<text x="24.0" y="336.0" class="t bold" text-anchor="start">Session 2: CPU and laptop GPU</text>
<line x1="300.0" y1="346.0" x2="300.0" y2="442.0" class="grid" stroke-width="1" />
