<text x="288.0" y="114.0" class="t small" text-anchor="end">Integrated pipeline (13 Nov)</text>
<rect x="300.0" y="101.0" width="233.2" height="18" rx="3" class="c fill"/>
<text x="541.2" y="114.0" class="s small" text-anchor="start">1399 ms</text>
<text x="288.0" y="146.0" class="t small" text-anchor="end">+ 32-class model INT8, union</text>
<rect x="300.0" y="133.0" width="200.8" height="18" rx="3" class="c fill"/>
<text x="508.8" y="146.0" class="s small" text-anchor="start">1205 ms</text>
<text x="288.0" y="178.0" class="t small" text-anchor="end">+ box-only mask upsampling</text>
<rect x="300.0" y="165.0" width="181.3" height="18" rx="3" class="c fill"/>
<text x="489.3" y="178.0" class="s small" text-anchor="start">1088 ms</text>
