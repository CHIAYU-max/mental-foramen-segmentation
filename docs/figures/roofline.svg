<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Roofline schematic"><style>
.bg{fill:#fcfcfb}.t{fill:#0b0b0b}.s{fill:#52514e}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.edge{stroke:#8a8983}
.a{--c:#2a78d6}.b{--c:#eb6834}.c{--c:#6e6d68}
.fill{fill:var(--c)}.line{stroke:var(--c)}.ring{stroke:#fcfcfb}.tint{fill:var(--c);fill-opacity:.12}.card{fill:#fcfcfb}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.title{font-size:16px;font-weight:600}.small{font-size:12px}.bold{font-weight:600}
@media (prefers-color-scheme:dark){
.bg,.card{fill:#1a1a19}.t{fill:#f0efec}.s{fill:#c3c2b7}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.edge{stroke:#8a8983}
.a{--c:#3987e5}.b{--c:#d95926}.c{--c:#a9a89f}.ring{stroke:#1a1a19}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8983"/></marker></defs><rect class="bg" width="760" height="340" rx="8"/>
<text x="24.0" y="30.0" class="t title" text-anchor="start">Below the ridge point, more compute goes unused</text>
<text x="24.0" y="50.0" class="s small" text-anchor="start">Schematic, not to scale; numbers measured on an RTX 3090</text>
<path d="M90 280H700" class="edge" fill="none" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M90 280V76" class="edge" fill="none" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="100.0" y="84.0" class="s small" text-anchor="start">Operations per second</text>
<text x="700.0" y="322.0" class="s small" text-anchor="end">Intensity: operations per byte moved (log scale)</text>
<path d="M90 260L383 110H690" class="a line" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
<line x1="383.0" y1="110.0" x2="383.0" y2="280.0" class="edge" stroke-width="1" stroke-dasharray="4 4"/>
<text x="383.0" y="299.0" class="t small" text-anchor="middle">Ridge ≈ 27.6 FLOP/byte</text>
<text x="550.0" y="100.0" class="t small" text-anchor="middle">Compute limit: about 23.9 TFLOP/s</text>
<text x="210.0" y="216.0" class="t small" text-anchor="start">Bandwidth limit</text>
<text x="210.0" y="232.0" class="s small" text-anchor="start">Slope = memory bandwidth</text>
<text x="236.0" y="268.0" class="s small" text-anchor="middle">Memory-bound</text>
<text x="540.0" y="268.0" class="s small" text-anchor="middle">Compute-bound</text>
<circle cx="333" cy="136" r="5" class="b line" fill="none" stroke-width="2"/>
<circle cx="365.0" cy="119.0" r="5" class="b fill ring" stroke-width="2"/>
<text x="395.0" y="160.0" class="t small" text-anchor="start">YOLO26n: 15.6 → 22.6 after fusion</text>
<circle cx="451.0" cy="110.0" r="5" class="a fill ring" stroke-width="2"/>
<text x="460.0" y="132.0" class="t small" text-anchor="start">U-Net: 59.9, right of the ridge</text></svg>
