<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 206" role="img" aria-label="Accelerator model"><style>
.bg{fill:#fcfcfb}.t{fill:#0b0b0b}.s{fill:#52514e}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.edge{stroke:#8a8983}
.a{--c:#2a78d6}.b{--c:#eb6834}.c{--c:#6e6d68}
.fill{fill:var(--c)}.line{stroke:var(--c)}.ring{stroke:#fcfcfb}.tint{fill:var(--c);fill-opacity:.12}.card{fill:#fcfcfb}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.title{font-size:16px;font-weight:600}.small{font-size:12px}.bold{font-weight:600}
@media (prefers-color-scheme:dark){
.bg,.card{fill:#1a1a19}.t{fill:#f0efec}.s{fill:#c3c2b7}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.edge{stroke:#8a8983}
.a{--c:#3987e5}.b{--c:#d95926}.c{--c:#a9a89f}.ring{stroke:#1a1a19}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8983"/></marker></defs><rect class="bg" width="760" height="206" rx="8"/>
<text x="24.0" y="30.0" class="t title" text-anchor="start">Array, SRAM and DRAM bandwidth must be sized together</text>
<rect x="24" y="62" width="200" height="86" rx="8" class="card edge" stroke-width="1.25"/>
<text x="38.0" y="85.0" class="t bold" text-anchor="start">External DRAM</text>
<text x="38.0" y="104.0" class="s small" text-anchor="start">24.5 MB weights and features</text>
<text x="38.0" y="121.0" class="s small" text-anchor="start">Sweep 4 / 12.8 / 25.6 GB/s</text>
<rect x="280" y="62" width="200" height="86" rx="8" class="card edge" stroke-width="1.25"/>
<text x="294.0" y="85.0" class="t bold" text-anchor="start">On-chip SRAM</text>
<text x="294.0" y="104.0" class="s small" text-anchor="start">Holds the current tile</text>
<text x="294.0" y="121.0" class="s small" text-anchor="start">Sweep 128 KB – 8 MB</text>
<rect x="536" y="62" width="200" height="86" rx="8" class="a tint line" stroke-width="2"/>
<text x="550.0" y="85.0" class="t bold" text-anchor="start">PE array</text>
<text x="550.0" y="104.0" class="s small" text-anchor="start">One INT8 MAC per PE per cycle</text>
<text x="550.0" y="121.0" class="s small" text-anchor="start">Sweep 8×8 – 64×64, 500 MHz</text>
<line x1="224.0" y1="98.0" x2="280.0" y2="98.0" class="edge" stroke-width="1.25" marker-end="url(#arrow)"/>
<line x1="280.0" y1="114.0" x2="224.0" y2="114.0" class="edge" stroke-width="1.25" marker-end="url(#arrow)"/>
<line x1="480.0" y1="98.0" x2="536.0" y2="98.0" class="edge" stroke-width="1.25" marker-end="url(#arrow)"/>
<line x1="536.0" y1="114.0" x2="480.0" y2="114.0" class="edge" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="24.0" y="182.0" class="s small" text-anchor="start">Layer time = max(compute time, transfer time). A larger SRAM moves the same data fewer times.</text></svg>
