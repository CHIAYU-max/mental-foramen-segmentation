<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 388" role="img" aria-label="Two-stage segmentation pipeline"><style>
.bg{fill:#fcfcfb}.t{fill:#0b0b0b}.s{fill:#52514e}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.edge{stroke:#8a8983}
.a{--c:#2a78d6}.b{--c:#eb6834}.c{--c:#6e6d68}
.fill{fill:var(--c)}.line{stroke:var(--c)}.ring{stroke:#fcfcfb}.tint{fill:var(--c);fill-opacity:.12}.card{fill:#fcfcfb}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.title{font-size:16px;font-weight:600}.small{font-size:12px}.bold{font-weight:600}
@media (prefers-color-scheme:dark){
.bg,.card{fill:#1a1a19}.t{fill:#f0efec}.s{fill:#c3c2b7}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.edge{stroke:#8a8983}
.a{--c:#3987e5}.b{--c:#d95926}.c{--c:#a9a89f}.ring{stroke:#1a1a19}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8983"/></marker></defs><rect class="bg" width="860" height="388" rx="8"/>
<text x="24.0" y="30.0" class="t title" text-anchor="start">Two-stage pipeline</text>
<text x="24.0" y="50.0" class="s small" text-anchor="start">From a panoramic radiograph to the mental foramen, the nerve canal and the tooth position</text>
<rect x="24" y="74" width="190" height="74" rx="8" class="card edge" stroke-width="1.25"/>
<text x="38.0" y="97.0" class="t bold" text-anchor="start">Panoramic radiograph</text>
<text x="38.0" y="116.0" class="s small" text-anchor="start">Input image</text>
<rect x="254" y="74" width="270" height="74" rx="8" class="a tint line" stroke-width="2"/>
<text x="268.0" y="97.0" class="t bold" text-anchor="start">Stage 1: teeth</text>
<text x="268.0" y="116.0" class="s small" text-anchor="start">YOLOv8s-seg, imgsz 1024</text>
<text x="268.0" y="133.0" class="s small" text-anchor="start">stage1/fdi_cropped.py</text>
<rect x="564" y="74" width="272" height="74" rx="8" class="card edge" stroke-width="1.25"/>
<text x="578.0" y="97.0" class="t bold" text-anchor="start">FDI numbering</text>
<text x="578.0" y="116.0" class="s small" text-anchor="start">Filtering, jaw split, tooth numbers</text>
<text x="578.0" y="133.0" class="s small" text-anchor="start">stage1/fdi_numbering.py</text>
<rect x="564" y="182" width="272" height="74" rx="8" class="card edge" stroke-width="1.25"/>
<text x="578.0" y="205.0" class="t bold" text-anchor="start">ROI crop and unsharp mask</text>
<text x="578.0" y="224.0" class="s small" text-anchor="start">Teeth 34–36 and 44–46</text>
<text x="578.0" y="241.0" class="s small" text-anchor="start">data/mf_unsharp_mask.py</text>
<rect x="254" y="182" width="270" height="74" rx="8" class="a tint line" stroke-width="2"/>
<text x="268.0" y="205.0" class="t bold" text-anchor="start">Stage 2: segmentation</text>
<text x="268.0" y="224.0" class="s small" text-anchor="start">U-Net with ResNet34 encoder, 512 × 512</text>
<text x="268.0" y="241.0" class="s small" text-anchor="start">stage2/kfold_unet_variants.py</text>
<rect x="24" y="182" width="190" height="74" rx="8" class="card edge" stroke-width="1.25"/>
<text x="38.0" y="205.0" class="t bold" text-anchor="start">Five-fold vote</text>
<text x="38.0" y="224.0" class="s small" text-anchor="start">Pixel-wise majority</text>
<text x="38.0" y="241.0" class="s small" text-anchor="start">stage2/kfold_pano.py</text>
<rect x="24" y="290" width="190" height="74" rx="8" class="card edge" stroke-width="1.25"/>
<text x="38.0" y="313.0" class="t bold" text-anchor="start">Largest region (lcc)</text>
<text x="38.0" y="332.0" class="s small" text-anchor="start">One foramen per ROI</text>
<text x="38.0" y="349.0" class="s small" text-anchor="start">stage2/mf_postproc.py</text>
<rect x="254" y="290" width="270" height="74" rx="8" class="b tint line" stroke-width="2"/>
<text x="268.0" y="313.0" class="t bold" text-anchor="start">Foramen and tooth position</text>
<text x="268.0" y="332.0" class="s small" text-anchor="start">Centroid, canal mask, FDI tooth position</text>
<text x="268.0" y="349.0" class="s small" text-anchor="start">position/mf_position.py</text>
<rect x="564" y="290" width="272" height="74" rx="8" class="card edge" stroke-width="1.25"/>
<text x="578.0" y="313.0" class="t bold" text-anchor="start">Clinician review</text>
<text x="578.0" y="332.0" class="s small" text-anchor="start">Model disagreement flags uncertain cases</text>
<text x="578.0" y="349.0" class="s small" text-anchor="start">analysis/pano_uncertainty.py</text>
<line x1="214.0" y1="111.0" x2="254.0" y2="111.0" class="edge" stroke-width="1.25" marker-end="url(#arrow)"/>
<line x1="524.0" y1="111.0" x2="564.0" y2="111.0" class="edge" stroke-width="1.25" marker-end="url(#arrow)"/>
<line x1="700.0" y1="148.0" x2="700.0" y2="182.0" class="edge" stroke-width="1.25" marker-end="url(#arrow)"/>
<line x1="564.0" y1="219.0" x2="524.0" y2="219.0" class="edge" stroke-width="1.25" marker-end="url(#arrow)"/>
<line x1="254.0" y1="219.0" x2="214.0" y2="219.0" class="edge" stroke-width="1.25" marker-end="url(#arrow)"/>
<line x1="119.0" y1="256.0" x2="119.0" y2="290.0" class="edge" stroke-width="1.25" marker-end="url(#arrow)"/>
<line x1="214.0" y1="327.0" x2="254.0" y2="327.0" class="edge" stroke-width="1.25" marker-end="url(#arrow)"/>
<line x1="524.0" y1="327.0" x2="564.0" y2="327.0" class="edge" stroke-width="1.25" marker-end="url(#arrow)"/></svg>
