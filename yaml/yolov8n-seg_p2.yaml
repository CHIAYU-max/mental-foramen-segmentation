# YOLOv8-seg with P2 head (4 scales: P2, P3, P4, P5)
nc: 2 # 你的類別數量 (例如只有 mf 時填 1)
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.50, 1024]
  s: [0.33, 0.50, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]] # 11 (cat backbone P4)
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 4], 1, Concat, [1]] # 14 (cat backbone P3)
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 2], 1, Concat, [1]] # 17 (cat backbone P2)
  - [-1, 3, C2f, [128]] # 18 (P2/4-tiny)

  - [-1, 1, Conv, [128, 3, 2]] # 19
  - [[-1, 15], 1, Concat, [1]] # 20 (cat head P3)
  - [-1, 3, C2f, [256]] # 21 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]] # 22
  - [[-1, 12], 1, Concat, [1]] # 23 (cat head P4)
  - [-1, 3, C2f, [512]] # 24 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]] # 25
  - [[-1, 9], 1, Concat, [1]] # 26 (cat head P5)
  - [-1, 3, C2f, [1024]] # 27 (P5/32)

  # Segment Head: 傳入 [P2, P3, P4, P5] 四層特徵
  - [[18, 21, 24, 27], 1, Segment, [nc, 32, 256]] # 28 (nc, proto_masks=32, proto_channels=256)